name: type-battle
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - battle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 10
  nakama:
    image: heroiclabs/nakama:3.22.0
    entrypoint: ["/bin/sh", "-ec", "/nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama && exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7350:7350"
      - "127.0.0.1:7351:7351"
    volumes:
      - ./server/modules:/nakama/data/modules:ro
      - ./server/local.yml:/nakama/data/local.yml:ro
volumes:
  battle-db:
